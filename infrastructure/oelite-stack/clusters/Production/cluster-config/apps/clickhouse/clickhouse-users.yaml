apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-users-config
  namespace: default
data:
  users.xml: |
    <clickhouse>
        <users>
            <default>
                <password></password>
                <networks>
                    <ip>::/0</ip>
                </networks>
                <profile>default</profile>
                <quota>default</quota>
            </default>
            <!-- Admin account with access_management. Password stored as SHA-256 hash,
                 never plaintext. Credential value lives only in the cluster secret store
                 (clickhouse-admin-secret, ns default). Ref: origin-auth #1683. -->
            <admin>
                <password_sha256_hex>0c8ea75cd3d87000def59711ba61c4b25581c408d831c6bade18e0e863d568c0</password_sha256_hex>
                <networks>
                    <ip>::/0</ip>
                </networks>
                <profile>default</profile>
                <quota>default</quota>
                <access_management>1</access_management>
            </admin>
        </users>
        <profiles>
            <default>
                <max_memory_usage>10000000000</max_memory_usage>
                <use_uncompressed_cache>0</use_uncompressed_cache>
                <load_balancing>random</load_balancing>
            </default>
        </profiles>
        <quotas>
            <default>
                <interval>
                    <duration>3600</duration>
                    <queries>0</queries>
                    <errors>0</errors>
                    <result_rows>0</result_rows>
                    <read_rows>0</read_rows>
                    <execution_time>0</execution_time>
                </interval>
            </default>
        </quotas>
    </clickhouse>