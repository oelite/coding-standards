# OElite Shared Local Infrastructure Stack
#
# One-time machine setup. Spins up a SINGLE MongoDB (sharded replica set),
# Redis, ClickHouse, Kafka, RabbitMQ, MinIO, and OpenSearch shared across ALL repos and
# worktrees.  Per-project isolation is achieved via database/namespace
# separation, NOT via separate container instances.
#
# Usage:
#   cd infrastructure/oelite-stack
#   ./oelite-stack.sh up          # Start all services
#   ./oelite-stack.sh health      # Check health of all services
#   ./oelite-stack.sh down        # Stop all services
#   docker compose --profile init up  # Run init containers (MongoDB shard + MinIO buckets + OpenSearch)
#
#   Connection strings (all via mongos — app code unchanged):
#   MongoDB:  mongodb://localhost:27017/?directConnection=true
#   Redis:    localhost:6379
#   ClickHouse: localhost:8123 (HTTP), localhost:9000 (TCP)
#   Kafka:    localhost:9092
#   RabbitMQ: localhost:5672,  management: localhost:15672
#   MinIO:    localhost:9000  (API),  localhost:9001 (Console)
#
#   Debug / Monitoring UIs (opt-in via --profile ui):
#   ./oelite-stack.sh up --with-ui
#   RedisInsight:     http://localhost:5540
#   Kafka UI:         http://localhost:8080
#   chmonitor:        http://localhost:3000
#   MongoStudio:      http://localhost:3141
#   RabbitMQ Mgmt:    http://localhost:15672
#   MinIO Console:    http://localhost:9001
#
# IMPORTANT: Never run `docker compose up` directly. Use oelite-stack.sh which
# handles health-check sequencing and the MongoDB init container.

services:

  # ─── MongoDB Sharded Replica Set ──────────────────────────────────────────
  # Production parity: 3-node config server replica set + 1 shard replica set.
  # mongos (router) is the single entry point for ALL client connections.
  # DO NOT expose mongod processes directly to application code.
  #
# Credentials are sourced from .env (gitignored) via env_file.
# .env is generated by ./scripts/generate-secrets.sh on first run.

  mongo-configsvr-1:
    image: mongo:8.0
    container_name: oelite-mongo-configsvr-1
    hostname: oelite-configsvr-1
    command: ["mongod", "--configsvr", "--replSet", "configReplSet", "--port", "27019",
              "--bind_ip_all"]
    volumes:
      - oelite-mongo-configsvr1-data:/data/db
      - ./.mongo.key:/data/mongo.key:ro
    ports:
      - "27019:27019"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "oelite-configsvr-1", "--port", "27019", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - oelite-infra

  mongo-configsvr-2:
    image: mongo:8.0
    container_name: oelite-mongo-configsvr-2
    hostname: oelite-configsvr-2
    command: ["mongod", "--configsvr", "--replSet", "configReplSet", "--port", "27019",
              "--bind_ip_all"]
    volumes:
      - oelite-mongo-configsvr2-data:/data/db
      - ./.mongo.key:/data/mongo.key:ro
    ports:
      - "27029:27019"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "oelite-configsvr-2", "--port", "27019", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - oelite-infra

  mongo-configsvr-3:
    image: mongo:8.0
    container_name: oelite-mongo-configsvr-3
    hostname: oelite-configsvr-3
    command: ["mongod", "--configsvr", "--replSet", "configReplSet", "--port", "27019",
              "--bind_ip_all"]
    volumes:
      - oelite-mongo-configsvr3-data:/data/db
      - ./.mongo.key:/data/mongo.key:ro
    ports:
      - "27039:27019"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "oelite-configsvr-3", "--port", "27019", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - oelite-infra

  mongo-shard-1-primary:
    image: mongo:8.0
    container_name: oelite-mongo-shard1-primary
    hostname: oelite-shard-1
    command: ["mongod", "--shardsvr", "--replSet", "shard1ReplSet", "--port", "27018",
              "--bind_ip_all"]
    volumes:
      - oelite-mongo-shard1-data:/data/db
      - ./.mongo.key:/data/mongo.key:ro
    ports:
      - "27018:27018"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "oelite-shard-1", "--port", "27018", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - oelite-infra

  mongo-shard-1-secondary:
    image: mongo:8.0
    container_name: oelite-mongo-shard1-secondary
    hostname: oelite-shard-1-arb
    # priority=0, votes=0 is set in init-shard.js (non-electable arbiter)
    command: ["mongod", "--shardsvr", "--replSet", "shard1ReplSet", "--port", "27018",
              "--bind_ip_all"]
    volumes:
      - oelite-mongo-shard1-arb-data:/data/db
      - ./.mongo.key:/data/mongo.key:ro
    ports:
      - "27028:27018"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "oelite-shard-1-arb", "--port", "27018", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - oelite-infra

  mongo-mongos:
    image: mongo:8.0
    container_name: oelite-mongos
    hostname: oelite-mongos
    command: ["mongos",
              "--configdb", "configReplSet/oelite-configsvr-1:27019,oelite-configsvr-2:27019,oelite-configsvr-3:27019",
              "--bind_ip_all",
              "--port", "27017"]
    volumes:
      - ./.mongo.key:/data/mongo.key:ro
    ports:
      - "27017:27017"
    mem_limit: 512m
    depends_on:
      mongo-configsvr-1:
        condition: service_healthy
      mongo-configsvr-2:
        condition: service_healthy
      mongo-configsvr-3:
        condition: service_healthy
      mongo-shard-1-primary:
        condition: service_healthy
      mongo-shard-1-secondary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "oelite-mongos", "--port", "27017", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - oelite-infra

  # ─── MongoStudio (MongoDB Web UI) ───────────────────────────────────────────
  # MongoDB GUI: schema explorer, aggregation builder, data editor, index management.
  # Access: http://localhost:3141 (via --profile ui)
  oelite-mongostudio:
    image: beztebya666/mongostudio:2.6.0
    container_name: oelite-mongostudio
    hostname: oelite-mongostudio
    ports:
      - "3141:3001"
    mem_limit: 512m
    depends_on:
      mongo-mongos:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@oelite-mongos:27017/?directConnection=true
      - ADMIN_ACCESS_KEY=${MONGODB_ADMIN_ACCESS_KEY}
      - RI_APP_HOST=0.0.0.0
    env_file:
      - .env
    volumes:
      - oelite-mongostudio-data:/app/data
    networks:
      - oelite-infra
    restart: unless-stopped
    profiles: [ui]

  # ─── Init Jobs (profile=init only, run once) ────────────────────────────
  #
  # MongoDB init must run in strict order:
  #   1. init-csrs   → configsvr replica set on configsvr-1
  #   2. init-shard  → shard1 replica set on shard-1
  #   3. add-shard   → mongos: adds shard1 to cluster (mongos context)
  #
  # Per-project databases/vhosts/buckets are created by each project during onboarding.
  # See scripts/init-per-project-dbs.sh, init-rabbitmq.sh, and init-minio.sh.
  #
  # Each job waits for its dependency to be healthy before starting.

  csrs-init:
    image: mongo:8.0
    container_name: oelite-csrs-init
    depends_on:
      mongo-configsvr-1:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
      - ./.mongo.key:/data/mongo.key:ro
    entrypoint: ["mongosh", "--host", "oelite-configsvr-1", "--port", "27019", "--quiet",
                 "--file", "/scripts/init-csrs.js"]
    networks: [oelite-infra]
    restart: "no"
    profiles: [init]

  shard-init:
    image: mongo:8.0
    container_name: oelite-shard-init
    depends_on:
      mongo-shard-1-primary:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
      - ./.mongo.key:/data/mongo.key:ro
    entrypoint: ["mongosh", "--host", "oelite-shard-1", "--port", "27018", "--quiet",
                 "--file", "/scripts/init-shard.js"]
    networks: [oelite-infra]
    restart: "no"
    profiles: [init]

  add-shard-init:
    image: mongo:8.0
    container_name: oelite-add-shard-init
    depends_on:
      mongo-mongos:
        condition: service_healthy
      shard-init:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/scripts
      - ./.mongo.key:/data/mongo.key:ro
    entrypoint: ["mongosh", "--host", "oelite-mongos", "--port", "27017", "--quiet",
                 "--file", "/scripts/add-shard.js"]
    networks: [oelite-infra]
    restart: "no"
    profiles: [init]

  # ─── Redis ────────────────────────────────────────────────────────────────
  oelite-redis:
    image: redis:8.8-alpine
    container_name: oelite-redis
    hostname: oelite-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1", "--loglevel", "notice"]
    env_file:
      - .env
    ports:
      - "6379:6379"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - oelite-redis-data:/data
    networks:
      - oelite-infra

  # ─── RedisInsight (Redis Web UI) ──────────────────────────────────────────
  # Official Redis GUI: key browser, Workbench CLI, profiler, slowlog, modules.
  # Access: http://localhost:5540 (via --profile ui)
  oelite-redisinsight:
    image: redis/redisinsight:1.34
    container_name: oelite-redisinsight
    hostname: oelite-redisinsight
    ports:
      - "5540:5540"
    mem_limit: 256m
    depends_on:
      oelite-redis:
        condition: service_healthy
    environment:
      RI_APP_HOST: 0.0.0.0
      RI_STORAGE: /data
    volumes:
      - oelite-redisinsight-data:/data
    networks:
      - oelite-infra
    restart: unless-stopped
    profiles: [ui]

  # ─── ClickHouse ───────────────────────────────────────────────────────────
  oelite-clickhouse:
    image: clickhouse/clickhouse-server:26.5
    container_name: oelite-clickhouse
    hostname: oelite-clickhouse
    ports:
      - "8123:8123"
    mem_limit: 2048m
    env_file:
      - .env
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      # Run an actual query, not just /ping: a memory-starved ClickHouse returns
      # 241 MEMORY_LIMIT_EXCEEDED on even `SELECT 1`, so this check MUST fail open.
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - oelite-clickhouse-data:/var/lib/clickhouse
      - ./scripts/init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Deterministic, memory-bounded ClickHouse config (no more 0.9x auto-heuristic).
      # See issue INFRA-1279 / https://code.phanes.ltd/oelite/coding-standards/-/issues/27
      - ./config/clickhouse/config.d/99-oelite-memory.xml:/etc/clickhouse-server/config.d/99-oelite-memory.xml:ro
      - ./config/clickhouse/users.d/99-oelite-limits.xml:/etc/clickhouse-server/users.d/99-oelite-limits.xml:ro
    networks:
      - oelite-infra

  # ─── chmonitor (ClickHouse Web UI) ──────────────────────────────────────────
  # Purpose-built ClickHouse dashboard: queries, merges, replication, health.
  # Reads system tables directly — no exporters needed.
  # Access: http://localhost:3000 (via --profile ui)
  oelite-chmonitor:
    image: ghcr.io/chmonitor/chmonitor:v0.3.0
    container_name: oelite-chmonitor
    hostname: oelite-chmonitor
    ports:
      - "3000:3000"
    mem_limit: 256m
    depends_on:
      oelite-clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: oelite-clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
    networks:
      - oelite-infra
    restart: unless-stopped
    profiles: [ui]

  # ─── Kafka (KRaft mode — no Zookeeper dependency) ───────────────────────
  oelite-kafka:
    image: confluentinc/cp-kafka:8.3.0
    container_name: oelite-kafka
    hostname: oelite-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@oelite-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list 2>/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - oelite-kafka-data:/var/lib/kafka/data
    networks:
      - oelite-infra

  # ─── Kafka UI (Kafka Web UI) ──────────────────────────────────────────────
  # Multi-cluster Kafka management: topics, consumer groups, lag, messages.
  # Access: http://localhost:8080 (via --profile ui)
  oelite-kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: oelite-kafka-ui
    hostname: oelite-kafka-ui
    ports:
      - "8080:8080"
    mem_limit: 512m
    depends_on:
      oelite-kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: oelite
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: oelite-kafka:9092
      KAFKA_CLUSTERS_0_READ_ONLY: "true"
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - oelite-infra
    restart: unless-stopped
    profiles: [ui]

  # ─── RabbitMQ ─────────────────────────────────────────────────────────────
  oelite-rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: oelite-rabbitmq
    hostname: oelite-rabbitmq
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
    volumes:
      - oelite-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - oelite-infra

  # ─── MinIO (S3-compatible, multi-tenant buckets) ─────────────────────────
  oelite-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: oelite-minio
    hostname: oelite-minio
    command: ["server", "/data", "--console-address", ":9001"]
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
    volumes:
      - oelite-minio-data:/data
    networks:
      - oelite-infra

  # ─── OpenSearch (search & analytics engine) ───────────────────────────────────
  # Lucene-based search engine with REST API. Single-node dev mode.
  oelite-opensearch:
    image: opensearchproject/opensearch:3.7.0
    container_name: oelite-opensearch
    hostname: oelite-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=OeliteAdmin123!
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - ACTION_SEARCH_FOR_NATIVE_PLUGIN=false
    ports:
      - "9200:9200"
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - oelite-opensearch-data:/usr/share/opensearch/data
    networks:
      - oelite-infra

  # ─── OpenSearch Dashboards (UI for monitoring/searching) ─────────────────────
  # Web UI for OpenSearch (similar to Kibana for Elasticsearch).
  # Runs under `--profile ui` (opt-in).
  oelite-opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.7.0
    container_name: oelite-opensearch-dashboards
    hostname: oelite-opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://oelite-opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    mem_limit: 512m
    depends_on:
      oelite-opensearch:
        condition: service_healthy
    networks:
      - oelite-infra
    profiles:
      - ui

# ─── Named Volumes ─────────────────────────────────────────────────────────
volumes:
  oelite-mongo-configsvr1-data:
  oelite-mongo-configsvr2-data:
  oelite-mongo-configsvr3-data:
  oelite-mongo-shard1-data:
  oelite-mongo-shard1-arb-data:
  oelite-redis-data:
  oelite-clickhouse-data:
  oelite-kafka-data:
  oelite-rabbitmq-data:
  oelite-minio-data:
  oelite-opensearch-data:
  oelite-redisinsight-data:
  oelite-mongostudio-data:

# ─── Network ────────────────────────────────────────────────────────────────
networks:
  oelite-infra:
    driver: bridge
