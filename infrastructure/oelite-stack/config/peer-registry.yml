# =============================================================================
# OElite Peer Service Registry — v1 (TASK-97, issue #97)
# =============================================================================
# Single source of truth for peer OElite platform service endpoints used by
# local development integration profiles. Owned by Ethan (DevOps); changes
# require an MR + Marcus architecture review (per Marcus's arbitration, #97).
#
# STRUCTURAL PROD-PREVENTION (Marcus Flag 3, fail-closed):
#   There is NO prod endpoint field in this schema. Production deploys read
#   peer endpoints from CI variables, never from this registry. Consumers must
#   only ever resolve `mock-peers`, `local-peers`, or `uat-peers` profiles.
#
# Credential rule (AC-003 / BR-DEV-005): credentials are NEVER committed.
# `credentials.source` names a per-machine Keychain service (or gitignored
# secret file). Developers hold read-only or tenant-scoped-write UAT
# credentials only — no admin/service-root UAT credentials on dev machines.
# `credentials.mode` (V2, TASK-99): `static` (default) = Keychain entries on
# the 90-day rotation SLA; `dynamic` = short-lived tokens minted via the
# Origin Auth client-credentials flow using the per-developer
# `dev-<username>-local` IAM client (TTL <= 15 min, refresh at 80% TTL;
# see 1_dotNet_coding_standards/18-DYNAMIC-PEER-CREDENTIALS.md).
#
# Profile semantics (Marcus Flag 2 + Emma stakeholder decision 1):
#   - mock-peers  : hermetic mocks for unit tests and CI (AC-004)
#   - local-peers : platform default — peers resolve to localhost shared stack
#   - uat-peers   : EXPLICIT opt-in; peers resolve to UAT endpoints
#   Local dev FAILS FAST when a required peer is down (no degraded fallback).
#   `critical: true` peers hard-fail; others fail with a clear error naming
#   the peer + the health-check command to run.
# =============================================================================

schemaVersion: 1
registryVersion: 1

profiles:
  mock-peers:
    description: Hermetic in-process mocks; used by unit tests and CI pipelines.
    endpointPattern: mock://
    allowedInCi: true
  local-peers:
    description: Platform default. Peers resolve to the local shared stack (localhost).
    endpointPattern: http://localhost
    allowedInCi: false
  uat-peers:
    description: Explicit opt-in. Peers resolve to shared UAT endpoints (*.uat.phanes.ltd).
    endpointPattern: "*.uat.phanes.ltd"
    allowedInCi: false

# -----------------------------------------------------------------------------
# Peers — all endpoint hostnames MUST match *.uat.phanes.ltd for uat channel.
# Fields per Marcus's final spec (#97 note 58413 §5):
#   contractVersion : version of the peer's API contract this registry pins
#   minVersion      : minimum peer version consumers may integrate against
#   channel         : release channel consumed (stable only, v1)
#   critical        : when true, peers-health/startup hard-fails if peer is down
#   mutability      : read-only | tenant-scoped | mutable
#   testTenantId    : reserved UAT test tenant for dev writes (BR-DEV-005)
#   resetPolicy     : weekly | monthly | manual — tenant data reset cadence
#   credentials     : where credentials live (Keychain source; never committed)
# -----------------------------------------------------------------------------
peers:
  - name: origin-auth
    displayName: Origin Auth (IAM)
    description: Central identity provider — JWT RS256 issuance/validation/revocation.
    repository: oelite/uranus/origin-auth
    endpoints:
      uat: https://origin-auth.uat.phanes.ltd
      local: http://localhost:50010
    contractUrl: https://origin-auth.uat.phanes.ltd/openapi/v1.json
    contractVersion: "1.4"
    minVersion: "1.2"
    channel: stable
    critical: true
    mutability: tenant-scoped
    testTenantId: uat-dev-tenant
    resetPolicy: weekly
    credentials:
      source: keychain
      mode: static
      keychainService: oelite-uat-origin-auth
      scopes:
        - openid
        - profile
        - oelite.api.read
    healthEndpoint: /health
    versionEndpoint: /version

  - name: kortex
    displayName: Kortex (Edge / DNS / Object Storage / CDN / Proxy)
    description: Edge auth proxy, versioned routes, object storage and CDN.
    repository: oelite/helios/kortex
    endpoints:
      uat: https://kortex.uat.phanes.ltd
      local: http://localhost:50011
    contractUrl: https://kortex.uat.phanes.ltd/openapi/v1.json
    contractVersion: "2.1"
    minVersion: "2.0"
    channel: stable
    critical: false
    mutability: tenant-scoped
    testTenantId: uat-dev-tenant
    resetPolicy: weekly
    credentials:
      source: keychain
      mode: static
      keychainService: oelite-uat-kortex
      scopes:
        - kortex.object.read
        - kortex.object.write
    healthEndpoint: /health
    versionEndpoint: /version

