# Regression pipeline for the shared GitLab wrapper and its readiness classifier.
# Runs only offline, secret-free suites: parser fixtures and disposable local Git
# repositories. No Keychain, no network credentials, no shared Docker stack.
#
# UAT integration auth boundary (V2, TASK-99 — BUSINESS-RULEBOOK § 8.2):
#   Hermetic jobs (everything below) NEVER mint UAT tokens. Jobs that must hit
#   UAT peers extend the `uat-integration-auth` template below: per-project
#   pipeline-scoped IAM client from protected CI variables, per-run mint,
#   token held only in job-scoped env, NEVER written to disk or cached across
#   jobs. Developer IAM clients (dev-<username>-local) are forbidden in CI.
# -----------------------------------------------------------------------------
# Pipeline trigger tiers (TASK-102 / CI-PIPELINE-EFFICIENCY-STANDARD.md §1)
# Reference implementation for the shared wrapper repo. MR pipelines + protected
# branches + scheduled/manual triggers only — no push pipelines on feature branches.
# -----------------------------------------------------------------------------
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'

stages:
  - test

# -----------------------------------------------------------------------------
# UAT integration auth template (V2, TASK-99) — DOCUMENTED PATTERN, NON-BLOCKING
# -----------------------------------------------------------------------------
# This template is intentionally not referenced by any job yet: hermetic CI
# never mints (AC-004). It documents the ONLY sanctioned pattern for a future
# UAT-touching integration job:
#
#   1. Register ONE per-project IAM client per consuming repo in the UAT realm
#      (client id: uat-ci-<project-slug>), scoped to exactly the peer
#      `credentials.scopes` the job needs. Registration is an Ethan-owned
#      realm operation, requested via GitLab issue on oelite/coding-standards.
#   2. Store the client id/secret as PROTECTED + MASKED CI/CD variables:
#        OELITE_UAT_IAM_CLIENT_ID / OELITE_UAT_IAM_CLIENT_SECRET
#      (optionally OELITE_UAT_TOKEN_ENDPOINT; defaults to the origin-auth UAT
#      realm token endpoint). Never as file-type variables.
#   3. The token is minted per job run (script below), held ONLY in the
#      job-scoped environment, and dies with the job. It must NEVER be
#      written to disk, artifacts, cache, or echoed into logs.
#
# To opt a job in: `extends: .uat-integration-auth` and export the minted
# token as $OELITE_UAT_TOKEN within the job's own script. GitLab protects
# protected-variable values from logs by default; do not disable masking.
.uat-integration-auth:
  variables:
    OELITE_UAT_TOKEN_ENDPOINT: https://origin-auth.uat.phanes.ltd/connect/token
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.phanes.ltd
  script:
    # Per-run mint (client-credentials, RFC 6749 §4.4). The client secret is
    # a protected+masked variable; it never appears in output. The access
    # token lives only in this job's process environment.
    - export OELITE_UAT_TOKEN="$(curl -fsS --max-time 10 "$OELITE_UAT_TOKEN_ENDPOINT"
      -d grant_type=client_credentials
      -d client_id="$OELITE_UAT_IAM_CLIENT_ID"
      -d client_secret="$OELITE_UAT_IAM_CLIENT_SECRET"
      -d scope="$OELITE_UAT_SCOPES" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
    # Sanity guard: fail closed if the mint returned nothing (never proceed unauthenticated).
    - test -n "$OELITE_UAT_TOKEN" || { echo "UAT token mint failed" >&2; exit 1; }
    # NOTE: no `echo $OELITE_UAT_TOKEN`, no artifacts, no cache — token dies with the job.

validate-peer-registry:
  stage: test
  image: python:3.12-alpine
  before_script:
    - pip install --no-cache-dir pyyaml jsonschema
  script:
    - python3 -c "import yaml, jsonschema, json; data=yaml.safe_load(open('infrastructure/oelite-stack/config/peer-registry.yml')); schema=json.load(open('infrastructure/oelite-stack/config/peer-registry.schema.json')); jsonschema.validate(instance=data, schema=schema); print('peer-registry.yml validates against peer-registry.schema.json')"
  rules:
    - changes:
        - infrastructure/oelite-stack/config/peer-registry.yml
        - infrastructure/oelite-stack/config/peer-registry.schema.json
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  timeout: 5m
  interruptible: true

peers-health-check:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0-alpine
  script:
    # Run against UAT peers — non-blocking warning so UAT outages don't block standards merges.
    # Registry validation above is the blocking gate; this job provides visibility.
    - dotnet run --project scripts/tools/peers-health/peers-health.csproj --configuration Release -- --profile uat-peers || true
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  timeout: 5m
  interruptible: true

scripts-regression:
  stage: test
  image: alpine:3.20
  before_script:
    - apk add --no-cache git zsh python3
  script:
    - python3 -m unittest discover -s tests/regression -p 'test_bug045_mr.py' -v
    - python3 tests/regression/test_parser_bugs.py
    - zsh tests/regression/test_bug045_sync.zsh
    - python3 -m unittest discover -s tests/regression -p 'test_requirements_authority.py' -v
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        test -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" || { printf '%s\n' 'Missing MR diff base SHA; requirements scan cannot run' >&2; exit 1; }
        test -n "$CI_COMMIT_SHA" || { printf '%s\n' 'Missing commit SHA; requirements scan cannot run' >&2; exit 1; }
        git diff --unified=0 "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA" > mr-requirements.diff || exit 1
        python3 scripts/check-requirements-authority.py --diff mr-requirements.diff
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  timeout: 10m
  interruptible: true
